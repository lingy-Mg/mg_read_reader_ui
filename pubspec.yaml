name: novel_reader_ui
description: An embeddable Flutter text reader with Android and Windows screen-awake support.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.example.novel_reader_ui
        pluginClass: NovelReaderUiPlugin
      windows:
        pluginClass: NovelReaderUiPluginCApi
